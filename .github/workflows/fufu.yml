name: fufu-watch

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test notification instead of checking"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fufu-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Send test notification
        if: ${{ inputs.test_email }}
        run: python fufu_watch_v_github.py --test-email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO_RESEND: ${{ secrets.MAIL_TO_RESEND }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Check availability
        if: ${{ !inputs.test_email }}
        run: python fufu_watch_v_github.py --debug
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO_RESEND: ${{ secrets.MAIL_TO_RESEND }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Save state
        if: ${{ !inputs.test_email }}
        run: |
          git config user.name "fufu-bot"
          git config user.email "fufu-bot@users.noreply.github.com"
          git add fufu_state.json || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
