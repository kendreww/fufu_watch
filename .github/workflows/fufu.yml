
name: fufu-watch

on:
  schedule:
    - cron: "7,22,37,52 * * * *"

  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test notification instead of checking"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fufu-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Send test notification
        if: ${{ inputs.test_email == true }}
        run: python fufu_watch_v_github.py --test-email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO_RESEND: ${{ secrets.MAIL_TO_RESEND }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Check availability
        if: ${{ inputs.test_email != true }}
        run: python -u fufu_watch_v_github.py --debug
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO_RESEND: ${{ secrets.MAIL_TO_RESEND }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Save state
        if: ${{ inputs.test_email != true }}
        run: |
          git config user.name "fufu-bot"
          git config user.email "fufu-bot@users.noreply.github.com"

          git add fufu_state.json

          if ! git diff --cached --quiet; then
            git commit -m "update state"
            git push origin HEAD:main
          else
            echo "No state changes to save."
          fi

      - name: Run summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "## FUFU Watcher"
            echo "- Status: $JOB_STATUS"
            echo "- Trigger: $EVENT_NAME"
            echo "- Time (UTC): $(date -u)"
          } >> "$GITHUB_STEP_SUMMARY"
